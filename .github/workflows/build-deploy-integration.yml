name: Build Deploy Integration

on:
    workflow_dispatch:

permissions:
    contents: read

env:
    AWS_REGION: ${{ secrets.AWS_REGION }}
    AWS_ARCHITECTURE: x86_64
    TEST_VIDEO_PATH: tests/integration/test_video.mp4

jobs:
    build-deploy-test:
        name: Build images, deploy functions, run integration tests
        runs-on: ubuntu-latest
        timeout-minutes: 180

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Free runner disk space
              run: |
                  echo "Disk before cleanup:"
                  df -h

                  # These preinstalled SDKs/toolchains are not needed for this workflow and
                  # take a lot of space on ubuntu-latest runners.
                  sudo rm -rf /usr/share/dotnet
                  sudo rm -rf /usr/local/lib/android
                  sudo rm -rf /opt/ghc
                  sudo rm -rf /opt/hostedtoolcache/CodeQL

                  # Clear Docker data before the heavy image build starts.
                  docker system prune -af || true
                  docker builder prune -af || true

                  echo "Disk after cleanup:"
                  df -h
                  docker system df || true

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Verify cloud identities
              run: |
                  aws sts get-caller-identity

            - name: Install test dependencies
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e tests

            - name: Build and deploy container functions
              env:
                  BASE_IMAGE_NAME: gcp_client_base
                  IMAGE_TAG: integration
              run: |
                  echo "Disk before container deploy:"
                  df -h
                  docker system df || true

                  chmod +x backend/scripts/deploy_all_functions.sh
                  bash backend/scripts/deploy_all_functions.sh

                  echo "Disk after container deploy:"
                  df -h
                  docker system df || true

            - name: Run integration tests
              run: |
                  pytest tests/integration -vv -s
