name: GCP auth check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  auth-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate required GitHub variables
        run: |
          test -n "${{ vars.GCP_PROJECT_ID }}" || (echo "Missing repo variable GCP_PROJECT_ID" && exit 1)
          test -n "${{ vars.GCP_REGION }}" || (echo "Missing repo variable GCP_REGION" && exit 1)
          test -n "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" || (echo "Missing repo variable GCP_WORKLOAD_IDENTITY_PROVIDER" && exit 1)
          test -n "${{ vars.GCP_SERVICE_ACCOUNT }}" || (echo "Missing repo variable GCP_SERVICE_ACCOUNT" && exit 1)

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Check GCP access
        run: |
          gcloud auth list
          gcloud config set project "${{ vars.GCP_PROJECT_ID }}"
          gcloud run services list --region "${{ vars.GCP_REGION }}"
