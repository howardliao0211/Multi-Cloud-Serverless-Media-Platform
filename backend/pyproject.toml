[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.10,<3.11"

dependencies = [
    "megadetector==10.0.20",
    "onnx2torch==1.5.15",
    "onnx==1.12.0",
    "protobuf==3.20.1",
    "opencv-python>=4.8.0",
    "pydantic>=2.13.4",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true