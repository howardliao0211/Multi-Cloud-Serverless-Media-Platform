[project]
name = "aussie-ecolens-ml-processor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "requests==2.32.3",
    "megadetector==10.0.20",
    "protobuf==3.20.1",
    "opencv-python-headless>=4.8.0",
    "pydantic>=2.13.4",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
